name: Backend checks
on:
  push:
    paths: ['backend/**', '.github/workflows/backend.yml', 'scripts/qa/**']
  pull_request:
    paths: ['backend/**', '.github/workflows/backend.yml', 'scripts/qa/**']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: orcub
          POSTGRES_PASSWORD: ci-test-only
          POSTGRES_DB: orcub_test
        ports: ['5432:5432']
        options: >-
          --health-cmd 'pg_isready -U orcub -d orcub_test'
          --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      DATABASE_URL: postgres://orcub:ci-test-only@127.0.0.1:5432/orcub_test
      SQLX_OFFLINE: 'true'
      ADMIN_TOKEN: ci-only-disposable-test-admin-token-0000
      CARGO_TERM_COLOR: always
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: backend -> target
      - run: cargo fmt --check
      - run: cargo clippy --all-targets --locked -- -D warnings
      - run: cargo test --locked
