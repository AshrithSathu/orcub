services:
  db:
    image: postgres:17-bookworm
    environment:
      POSTGRES_USER: orcub
      POSTGRES_PASSWORD: local-development-only
      POSTGRES_DB: orcub
    ports: ["127.0.0.1:55432:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U orcub"]
      interval: 2s
      timeout: 3s
      retries: 30
    volumes: ["postgres:/var/lib/postgresql/data"]
  api:
    build: .
    environment:
      DATABASE_URL: postgres://orcub:local-development-only@db/orcub
      ADMIN_TOKEN: ${ADMIN_TOKEN:?Set ADMIN_TOKEN to a random secret of at least 32 characters}
      RETENTION_DAYS: 400
      TRUST_COUNTRY_HEADERS: "false"
      RUST_LOG: orcub_backend=info
    ports: ["127.0.0.1:8080:8080"]
    depends_on:
      db:
        condition: service_healthy
volumes:
  postgres:
